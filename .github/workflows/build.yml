name: Cross-Platform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform-dir: windows
          - os: ubuntu-latest
            platform-dir: linux
          - os: macos-latest
            platform-dir: macos

    steps:
    # --- CHECKOUT CONFIGURATION (UPDATED TO V5 FOR NODE 24) ---
    - name: Checkout Code
      uses: actions/checkout@v5

    # --- ENVIRONMENT SETUP ---
    - name: Set up Environment (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl1-mesa-dev libssl-dev qt6-base-dev

    - name: Set up Environment (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install cmake qt6 openssl@3

    - name: Set up Environment (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-openssl

    # --- COMPILATION STAGE ---
    - name: Configure and Build (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: Configure and Build (macOS ARM64)
      if: matrix.os == 'macos-latest'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/qt6;/opt/homebrew/opt/openssl@3"
        cmake --build build --config Release

    - name: Configure and Build (Windows MSYS2)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    # --- POST-BUILD DEPLOYMENT STEPS ---
    - name: Prepare Workspace Directory Layout
      run: mkdir -p staging-area/build/${{ matrix.platform-dir }}

    - name: Bundle Windows Assets
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        windeployqt build/pdf-integrity-friend.exe --dir staging-area/build/windows/
        cp build/pdf-integrity-friend.exe staging-area/build/windows/
        cp /mingw64/bin/libcrypto-3-x64.dll staging-area/build/windows/
        cp /mingw64/bin/libssl-3-x64.dll staging-area/build/windows/
        cp /mingw64/bin/libwinpthread-1.dll staging-area/build/windows/
        cp /mingw64/bin/libstdc++-6.dll staging-area/build/windows/
        cp /mingw64/bin/libgcc_s_seh-1.dll staging-area/build/windows/
        cp tsa_config.json staging-area/build/windows/

    - name: Bundle macOS App Bundle
      if: matrix.os == 'macos-latest'
      run: |
        /opt/homebrew/opt/qt6/bin/macdeployqt build/pdf-integrity-friend.app -always-overwrite
        cp tsa_config.json build/pdf-integrity-friend.app/Contents/Resources/ || true
        zip -r staging-area/build/macos/pdf-integrity-friend-mac.zip build/pdf-integrity-friend.app

    - name: Bundle Linux Binary
      if: matrix.os == 'ubuntu-latest'
      run: |
        cp build/pdf-integrity-friend staging-area/build/linux/
        cp tsa_config.json staging-area/build/linux/

    # --- IN-PLACE DEPLOYMENT PIPELINE (UPDATED TO V5 FOR NODE 24) ---
    - name: Commit Compiled Assets directly to Active Build Folder
      uses: JamesIves/github-pages-deploy-action@v5
      with:
        folder: staging-area
        branch: ${{ github.ref_name }} # Dynamically updates your current active branch
        target-folder: .               # Retains the root /build path inside your repository
