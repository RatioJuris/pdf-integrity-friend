name: Cross-Platform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: write

jobs:
  # STAGE 1: Compile all binaries independently across individual nodes
  compile:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform-dir: windows
          - os: ubuntu-latest
            platform-dir: linux
          - os: macos-latest
            platform-dir: macos

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    # --- ENVIRONMENT SETUP ---
    - name: Set up Environment (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl1-mesa-dev libssl-dev qt6-base-dev

    - name: Set up Environment (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install cmake qt6 openssl@3

    - name: Set up Environment (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-openssl

    # --- COMPILATION STAGE ---
    - name: Configure and Build (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: Configure and Build (macOS ARM64)
      if: matrix.os == 'macos-latest'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/qt6;/opt/homebrew/opt/openssl@3"
        cmake --build build --config Release

    - name: Configure and Build (Windows MSYS2)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    # --- POST-BUILD STRUCTURING & INTERMEDIATE ARTIFACT UPLOAD ---
    - name: Prepare Local Workspace Staging Layout
      run: mkdir -p staging/${{ matrix.platform-dir }}

    - name: Bundle Windows Assets
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        windeployqt build/pdf-integrity-friend.exe --dir staging/windows/
        cp build/pdf-integrity-friend.exe staging/windows/
        cp /mingw64/bin/libcrypto-3-x64.dll staging/windows/
        cp /mingw64/bin/libssl-3-x64.dll staging/windows/
        cp /mingw64/bin/libwinpthread-1.dll staging/windows/
        cp /mingw64/bin/libstdc++-6.dll staging/windows/
        cp /mingw64/bin/libgcc_s_seh-1.dll staging/windows/
        cp tsa_config.json staging/windows/

    - name: Bundle macOS App Bundle
      if: matrix.os == 'macos-latest'
      run: |
        /opt/homebrew/opt/qt6/bin/macdeployqt build/pdf-integrity-friend.app -always-overwrite
        cp tsa_config.json build/pdf-integrity-friend.app/Contents/Resources/ || true
        zip -r staging/macos/pdf-integrity-friend-mac.zip build/pdf-integrity-friend.app

    - name: Bundle Linux Binary
      if: matrix.os == 'ubuntu-latest'
      run: |
        cp build/pdf-integrity-friend staging/linux/
        cp tsa_config.json staging/linux/

    - name: Upload Intermediate Build Assets
      uses: actions/upload-artifact@v5
      with:
        name: asset-${{ matrix.platform-dir }}
        path: staging/

  # STAGE 2: Securely aggregate all files and push directly to git using native commands
  deploy-to-repo:
    name: Consolidate and Push Assets
    needs: compile
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Base Target Directory
      run: mkdir -p build

    - name: Download Windows Target Binary Component
      uses: actions/download-artifact@v5
      with:
        name: asset-windows
        path: build/

    - name: Download Linux Target Binary Component
      uses: actions/download-artifact@v5
      with:
        name: asset-linux
        path: build/

    - name: Download macOS Target Binary Component
      uses: actions/download-artifact@v5
      with:
        name: asset-macos
        path: build/

    - name: Native In-Place Repository Commit
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Pull latest changes to avoid out-of-sync states
        git pull origin ${{ github.ref_name }} --rebase
        
        # Stage the /build folder directly
        git add build/
        
        # Check if changes exist before trying to create a commit block
        if git diff-index --quiet HEAD --; then
          echo "No new executable binary alterations discovered. Skipping commit pipeline."
        else
          git commit -m "Automated native workspace binary distribution update [Skip CI]"
          git push origin HEAD:${{ github.ref_name }}
        fi
