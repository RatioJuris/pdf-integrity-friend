name: Release Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qt_arch: win64_msvc2022_64
            build_dir: build/x64
            output_dir: release-latest/windows-x64

          - arch: x86
            qt_arch: win32_msvc2022
            build_dir: build/x86
            output_dir: release-latest/windows-x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow cairosvg

      # FIXED: Added native chocolatey deployment to supply required cairo-2.dll binaries to python environment
      - name: Install Cairo Library Binaries
        run: |
          choco install cairo -y
          echo "C:\Program Files\Cairo\bin" >> $GITHUB_PATH
        shell: bash

      - name: Generate Icons
        run: |
          python scripts/generate_icons.py

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtpdf

      - name: Configure
        run: |
          cmake -S . `
                -B ${{ matrix.build_dir }} `
                -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build ${{ matrix.build_dir }} --config Release

      - name: Create Release Layout
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ matrix.output_dir }}"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ matrix.output_dir }}\config"

      - name: Copy Executable
        shell: pwsh
        run: |
          Copy-Item `
            "${{ matrix.build_dir }}\Release\*" `
            "${{ matrix.output_dir }}" `
            -Recurse `
            -Force

      - name: Copy Configuration
        shell: pwsh
        run: |
          Copy-Item `
            "config\*" `
            "${{ matrix.output_dir }}\config" `
            -Recurse `
            -Force

      - name: Copy Documentation
        shell: pwsh
        run: |
          Copy-Item LICENSE.md "${{ matrix.output_dir }}"

          if(Test-Path README.md)
          {
              Copy-Item README.md "${{ matrix.output_dir }}"
          }

          if(Test-Path SECURITY.md)
          {
              Copy-Item SECURITY.md "${{ matrix.output_dir }}"
          }

          if(Test-Path CHANGELOG.md)
          {
              Copy-Item CHANGELOG.md "${{ matrix.output_dir }}"
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ matrix.output_dir }}\*" `
            -DestinationPath `
            "release-latest/pdf-integrity-friend-${{ matrix.arch }}.zip" `
            -Force

      - name: Upload Release Files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: release-latest
