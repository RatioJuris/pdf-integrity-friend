name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BOT_NAME: "RatioJurisBot"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qt_arch: win64_msvc2022_64
            build_dir: build/x64
            release_dir: release-latest/x64

          - arch: x86
            qt_arch: win32_msvc2022
            build_dir: build/x86
            release_dir: release-latest/x86

    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🛠️ REMOVED MANUAL CHOCO CAIRO AND PIP CODES. PYTHON SCRIPT SELF-INSTALLS AUTOMATICALLY
      - name: Generate Icons
        run: |
          python scripts/generate_icons.py

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtpdf

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B "${{ matrix.build_dir }}" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake `
            --build "${{ matrix.build_dir }}" `
            --config Release

      - name: Create Release Directory
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ matrix.release_dir }}"

      - name: Copy Executable and Runtime
        shell: pwsh
        run: |
          Copy-Item `
            "${{ matrix.build_dir }}\Release\*" `
            "${{ matrix.release_dir }}" `
            -Recurse `
            -Force

      - name: Copy Config Files
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ matrix.release_dir }}\config"

          Copy-Item `
            "config\*" `
            "${{ matrix.release_dir }}\config" `
            -Recurse `
            -Force

      - name: Copy Documentation
        shell: pwsh
        run: |
          if (Test-Path LICENSE.md)
          {
              Copy-Item LICENSE.md "${{ matrix.release_dir }}"
          }
          if (Test-Path README.md)
          {
              Copy-Item README.md "${{ matrix.release_dir }}"
          }
          if (Test-Path SECURITY.md)
          {
              Copy-Item SECURITY.md "${{ matrix.release_dir }}"
          }
          if (Test-Path CHANGELOG.md)
          {
              Copy-Item CHANGELOG.md "${{ matrix.release_dir }}"
          }

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ matrix.release_dir }}\*" `
            -DestinationPath "release-latest\portable-${{ matrix.arch }}.zip" `
            -Force

      - name: Upload Portable Package
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.arch }}
          path: release-latest/portable-${{ matrix.arch }}.zip

  github-release:
    needs: release
    runs-on: windows-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.zip
          generate_release_notes: true
