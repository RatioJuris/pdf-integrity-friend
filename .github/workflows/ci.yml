name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: write

env:
  BOT_NAME: RatioJurisBot

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qt_arch: win64_msvc2022_64
            build_dir: build/x64
          - arch: x86
            qt_arch: win32_msvc2022
            build_dir: build/x86

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtpdf

      # 🌟 RE-ORDERED: Executes natively using the initialized Qt environment paths
      - name: Generate Icons via Qt PowerShell
        shell: pwsh
        run: |
          ./scripts/generate_icons.ps1

      - name: Verify Generated Resources
        shell: pwsh
        run: |
          Get-ChildItem res/generated

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B "${{ matrix.build_dir }}" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake `
            --build "${{ matrix.build_dir }}" `
            --config Release

      - name: Verify Executable
        shell: pwsh
        run: |
          Get-ChildItem `
            "${{ matrix.build_dir }}" `
            -Recurse `
            -Filter "*.exe"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: ${{ matrix.build_dir }}
