name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: write

# Identifies this automated process under the RatioJurisBot configuration namespace
env:
  BOT_NAME: "RatioJurisBot"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qt_arch: win64_msvc2022_64
            build_dir: build/x64

          - arch: x86
            qt_arch: win32_msvc2022
            build_dir: build/x86

    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow cairosvg

      - name: Install Cairo Library Binaries
        run: |
          choco install cairo -y
          echo "C:\Program Files\Cairo\bin" >> $GITHUB_PATH
        shell: bash

      - name: Generate Icons
        run: |
          python scripts/generate_icons.py

      - name: Verify Generated Files
        shell: pwsh
        run: |
          Get-ChildItem res/generated

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtpdf

      - name: Configure
        run: |
          cmake `
            -S . `
            -B ${{ matrix.build_dir }} `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake `
            --build ${{ matrix.build_dir }} --config Release

      - name: Verify Executable
        shell: pwsh
        run: |
          Get-ChildItem `
            "${{ matrix.build_dir }}" `
            -Recurse `
            -Filter "*.exe"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: ${{ matrix.build_dir }}
