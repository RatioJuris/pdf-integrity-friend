name: PDF Integrity Friend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: x64
            qt_arch: win64_msvc2022_64
            build_dir: build/x64
            release_dir: release-latest/windows-x64

          - name: x86
            qt_arch: win32_msvc2022
            build_dir: build/x86
            release_dir: release-latest/windows-x86

    runs-on: windows-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          pip install pillow
          pip install cairosvg

      - name: Generate Icons
        run: |
          python scripts/generate_icons.py

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtpdf

      - name: Configure CMake
        run: |
          cmake ^
            -S . ^
            -B ${{ matrix.build_dir }} ^
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake ^
            --build ${{ matrix.build_dir }} ^
            --config Release

      - name: Create Release Folder
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ matrix.release_dir }}"

      - name: Copy Build Output
        shell: pwsh
        run: |
          Copy-Item `
            "${{ matrix.build_dir }}\\Release\\*" `
            "${{ matrix.release_dir }}" `
            -Recurse `
            -Force

      - name: Copy Documentation
        shell: pwsh
        run: |
          Copy-Item LICENSE.md "${{ matrix.release_dir }}"
          
          if(Test-Path README.md)
          {
              Copy-Item README.md "${{ matrix.release_dir }}"
          }

          if(Test-Path SECURITY.md)
          {
              Copy-Item SECURITY.md "${{ matrix.release_dir }}"
          }

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ matrix.release_dir }}\\*" `
            -DestinationPath "release-latest/pdf-integrity-friend-${{ matrix.name }}.zip" `
            -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-integrity-friend-${{ matrix.name }}
          path: release-latest/
