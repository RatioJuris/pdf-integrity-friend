name: Release Packaging

on:

  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-latest
            platform: windows

          - os: ubuntu-latest
            platform: linux

          - os: macos-latest
            platform: macos

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            ninja-build \
            libssl-dev

      # ======================================
      # BUILD DIRECTORY
      # ======================================

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build/${{ matrix.platform }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake \
            --build build/${{ matrix.platform }} \
            --config Release

      # ======================================
      # RELEASE DIRECTORY
      # ======================================

      - name: Create Release Folder
        shell: bash
        run: |
          mkdir -p release/${{ matrix.platform }}

      # ======================================
      # WINDOWS
      # ======================================

      - name: Create ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/* `
            -DestinationPath release/windows/pdf-integrity-friend-windows.zip

      - name: Create MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "Integrate WiX Toolset here"

      # ======================================
      # LINUX
      # ======================================

      - name: Create TAR.GZ
        if: runner.os == 'Linux'
        run: |
          tar -czf \
          release/linux/pdf-integrity-friend-linux.tar.gz \
          build/linux

      # ======================================
      # MACOS
      # ======================================

      - name: Create macOS ZIP
        if: runner.os == 'macOS'
        run: |
          ditto -c -k \
          build/macos \
          release/macos/pdf-integrity-friend-macos.zip

      - name: Create DMG
        if: runner.os == 'macOS'
        run: |
          hdiutil create \
            -volname "PDF Integrity Friend" \
            -srcfolder build/macos \
            -ov \
            -format UDZO \
            release/macos/pdf-integrity-friend.dmg

      # ======================================
      # UPLOAD RELEASE ARTIFACTS
      # ======================================

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/${{ matrix.platform }}

  github-release:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/release/windows/*
            **/release/linux/*
            **/release/macos/*
