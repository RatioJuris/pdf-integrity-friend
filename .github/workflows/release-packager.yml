name: Production Asset Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: write

jobs:
  # =========================================================================
  # STAGE 1: Isolated Matrix Compilation Nodes
  # =========================================================================
  compile:
    name: Build Production Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform-key: windows
          - os: ubuntu-latest
            platform-key: linux
          - os: macos-latest
            platform-key: macos

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v5

    # --- NATIVE OPERATING SYSTEM SUB-ENVIRONMENT RESOLUTION ---
    - name: Set up Native Dependencies (Ubuntu Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl1-mesa-dev libssl-dev qt6-base-dev

    - name: Set up Native Dependencies (macOS ARM64)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install cmake qt6 openssl@3

    - name: Set up Native Dependencies (Windows MSYS2 Engine)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-openssl

    # --- CRYPTOGRAPHIC C++ CODE COMPILATION ARCS ---
    - name: Build Payload Binary (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: Build Payload Binary (macOS Apple Silicon)
      if: matrix.os == 'macos-latest'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/qt6;/opt/homebrew/opt/openssl@3"
        cmake --build build --config Release

    - name: Build Payload Binary (Windows MSYS2 Toolchain)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    # --- LOCALIZED ISOLATED TARGET PACKAGING STAGES ---
    - name: Initialize Transitory Output Sandbox
      run: mkdir -p runtime-staging

    - name: Assemble Distribution Package (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        windeployqt build/pdf-integrity-friend.exe --dir runtime-staging/
        cp build/pdf-integrity-friend.exe runtime-staging/
        cp /mingw64/bin/libcrypto-3-x64.dll runtime-staging/
        cp /mingw64/bin/libssl-3-x64.dll runtime-staging/
        cp /mingw64/bin/libwinpthread-1.dll runtime-staging/
        cp /mingw64/bin/libstdc++-6.dll runtime-staging/
        cp /mingw64/bin/libgcc_s_seh-1.dll runtime-staging/
        cp tsa_config.json runtime-staging/

    - name: Assemble Distribution Package (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        /opt/homebrew/opt/qt6/bin/macdeployqt build/pdf-integrity-friend.app -always-overwrite
        cp tsa_config.json build/pdf-integrity-friend.app/Contents/Resources/ || true
        zip -r runtime-staging/pdf-integrity-friend-mac.zip build/pdf-integrity-friend.app

    - name: Assemble Distribution Package (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cp build/pdf-integrity-friend runtime-staging/
        cp tsa_config.json runtime-staging/

    - name: Transit Packages onto Intermediate Storage Layers
      uses: actions/upload-artifact@v5
      with:
        name: compilation-bundle-${{ matrix.platform-key }}
        path: runtime-staging/
        retention-days: 1

  # =========================================================================
  # STAGE 2: Monolithic Synchronization & Repository Injection Node
  # =========================================================================
  deploy-to-repo:
    name: Consolidate and Push Assets
    needs: compile
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Base securely
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Enforce Directory Isolation Bounds
      run: |
        mkdir -p temporary-vault/windows
        mkdir -p temporary-vault/linux
        mkdir -p temporary-vault/macos
        mkdir -p build/windows
        mkdir -p build/linux
        mkdir -p build/macos

    - name: Pull Windows Target Build Chunks
      uses: actions/download-artifact@v5
      with:
        name: compilation-bundle-windows
        path: temporary-vault/windows

    - name: Pull Linux Target Build Chunks
      uses: actions/download-artifact@v5
      with:
        name: compilation-bundle-linux
        path: temporary-vault/linux

    - name: Pull macOS Target Build Chunks
      uses: actions/download-artifact@v5
      with:
        name: compilation-bundle-macos
        path: temporary-vault/macos

    - name: Secure Build Matrix Transfer Linkage
      run: |
        cp -r temporary-vault/windows/* build/windows/
        cp -r temporary-vault/linux/* build/linux/
        cp -r temporary-vault/macos/* build/macos/
        rm -rf temporary-vault

    - name: Publish Production Target Assets to Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git pull origin ${{ github.ref_name }} --rebase
        git add build/
        
        if git diff-index --quiet HEAD --; then
          echo "Zero file changes verified inside binary tracking arrays. Terminating pipeline execution."
        else
          git commit -m "chore(distribution): update binary assets for tag [Skip CI]"
          git push origin HEAD:${{ github.ref_name }}
        fi
